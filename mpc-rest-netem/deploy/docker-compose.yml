services:
  node1:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mpc-node1
    cap_add:
      - NET_ADMIN
    environment:
      NODE_ID: "node1"
      LISTEN_ADDR: ":8080"
      BASE_URL: "http://node1:8080"
      DATA_DIR: "/app/data"
      SHARE_PATH: "/app/data/node1-share.json"
      THRESHOLD: "1"
      HTTP_TIMEOUT: "600s"
      SESSION_TIMEOUT: "600s"
      TSS_TIMEOUT: "600s"
      PREPARAM_TIMEOUT: "600s"
      PREPARAM_CONCURRENCY: "4"
      PEERS_JSON: '[{"id":"node1","base_url":"http://node1:8080"},{"id":"node2","base_url":"http://node2:8080"},{"id":"node3","base_url":"http://node3:8080"}]'
    volumes:
      - node1-data:/app/data
    ports:
      - "8081:8080"

  node2:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mpc-node2
    cap_add:
      - NET_ADMIN
    environment:
      NODE_ID: "node2"
      LISTEN_ADDR: ":8080"
      BASE_URL: "http://node2:8080"
      DATA_DIR: "/app/data"
      SHARE_PATH: "/app/data/node2-share.json"
      THRESHOLD: "1"
      HTTP_TIMEOUT: "600s"
      SESSION_TIMEOUT: "600s"
      TSS_TIMEOUT: "600s"
      PREPARAM_TIMEOUT: "600s"
      PREPARAM_CONCURRENCY: "4"
      PEERS_JSON: '[{"id":"node1","base_url":"http://node1:8080"},{"id":"node2","base_url":"http://node2:8080"},{"id":"node3","base_url":"http://node3:8080"}]'
    volumes:
      - node2-data:/app/data
    ports:
      - "8082:8080"

  node3:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mpc-node3
    cap_add:
      - NET_ADMIN
    environment:
      NODE_ID: "node3"
      LISTEN_ADDR: ":8080"
      BASE_URL: "http://node3:8080"
      DATA_DIR: "/app/data"
      SHARE_PATH: "/app/data/node3-share.json"
      THRESHOLD: "1"
      HTTP_TIMEOUT: "600s"
      SESSION_TIMEOUT: "600s"
      TSS_TIMEOUT: "600s"
      PREPARAM_TIMEOUT: "600s"
      PREPARAM_CONCURRENCY: "4"
      PEERS_JSON: '[{"id":"node1","base_url":"http://node1:8080"},{"id":"node2","base_url":"http://node2:8080"},{"id":"node3","base_url":"http://node3:8080"}]'
    volumes:
      - node3-data:/app/data
    ports:
      - "8083:8080"

volumes:
  node1-data:
  node2-data:
  node3-data: